# Mosquitto 2.x — Mitra control plane.
# The backend owns /mosquitto/auth/passwd (regenerated from the device table). The entrypoint copies
# it to /mosquitto/run/ with mosquitto-only permissions and reloads the broker when it changes. Devices reach the broker via Caddy at wss://<domain>/mqtt.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/run/passwd
acl_file /mosquitto/run/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 300
max_queued_messages 100
max_inflight_messages 20
max_packet_size 65536

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Internal TCP listener for the backend (not published outside the compose network).
listener 1883 0.0.0.0
protocol mqtt

# WebSocket listener, fronted by Caddy TLS on :443 (/mqtt).
listener 9001 0.0.0.0
protocol websockets
